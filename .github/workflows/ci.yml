name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm web:build

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/spending-limits
    env:
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt && rustup default 1.99.1
      - run: cargo fmt --check
      - run: |
          for crate in tests/mocks/mock-ft tests/sandbox verification; do
            cargo fmt --check --manifest-path "$crate/Cargo.toml"
          done
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # RUSTSEC-2026-0387 (crypto-bigint) only reaches the unit-test runtime that near-sdk's
      # `unit-testing` feature pulls in; `cargo tree -e normal --target wasm32-unknown-unknown`
      # shows it is not part of the contract wasm.
      - run: cargo audit --ignore RUSTSEC-2026-0387
