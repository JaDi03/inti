[package]
name = "inti-spending-limits"
version = "1.0.0"
edition = "2021"
description = "Spending limits for an AI agent: lives on the user's own NEAR account and funds the user's agent within limits"
license = "MIT"
repository = "https://github.com/JaDi03/inti"

[package.metadata.near.reproducible_build]
# Build environment, identified by its digest; the tag is descriptive only.
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.29.1", default-features = false, features = ["unit-testing"] }
proptest = "=1.12.0"

[lints.rust]
# The property tests include the Kani model, which uses `cfg(kani)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
