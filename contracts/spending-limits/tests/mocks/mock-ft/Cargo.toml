[package]
name = "spending-limits-mock-ft"
version = "0.0.0"
edition = "2021"
description = "Test token and receiver for the Spending Limits sandbox tests; can misbehave on purpose"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
